[package]
name = "openai-responses"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Type-safe, async Rust SDK for OpenAI Responses API with advanced features like SIMD JSON parsing, streaming, and zero-copy optimizations"
license = "MIT"
repository = "https://github.com/yourusername/openai-responses-rs"
documentation = "https://docs.rs/openai-responses"
homepage = "https://github.com/yourusername/openai-responses-rs"
readme = "README.md"
keywords = ["openai", "api", "ai", "responses", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]
rust-version = "1.70"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"
backon = "0.4"
futures = "0.3"
url = "2.4"
# New dependencies for Rust-specific improvements
anyhow = { version = "1.0", optional = true }
simd-json = { version = "0.13", optional = true }
async-trait = { version = "0.1", optional = true }
tokio-stream = { version = "0.1", optional = true }

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/default-tls"]
# Advanced features
enhanced-errors = ["anyhow"]
simd = ["simd-json"]
streaming = ["tokio-stream", "async-trait"]
backend-abstraction = ["async-trait"]

[[example]]
name = "response_simple"
path = "examples/response_simple.rs"

[[example]]
name = "response_basics"
path = "examples/response_basics.rs"

[[example]]
name = "response_async_batch"
path = "examples/response_async_batch.rs"

[[example]]
name = "response_streaming"
path = "examples/response_streaming.rs"

[[example]]
name = "response_rust_features"
path = "examples/response_rust_features.rs"

[[example]]
name = "response_text_generation"
path = "examples/response_text_generation.rs"

[[example]]
name = "response_conversation"
path = "examples/response_conversation.rs"

